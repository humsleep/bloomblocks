<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>town dev</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #141a33; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      #safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
        padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="safe"></div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
