<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Duskwick</title>
    <style>
      /* Text-free UI: no web font on the cold-start path. */
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        /* dusk sky → courtyard ground, so the frame before the canvas paints already matches */
        background: linear-gradient(#141a33 0%, #2b2350 30%, #171a31 55%, #0f1124 100%);
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* Full-bleed canvas (sky behind the status bar, ground behind the home
         indicator); the scene lays out inside the safe area itself. */
      #app { position: fixed; inset: 0; }
      /* Safe-area probe. --safe-* is injected natively at document start
         (MainViewController) because WKWebView's env() insets are still 0 when
         the first frame is laid out. */
      #safe {
        position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
        padding-top: max(env(safe-area-inset-top), var(--safe-top, 0px));
        padding-bottom: max(env(safe-area-inset-bottom), var(--safe-bottom, 0px));
        padding-left: max(env(safe-area-inset-left), var(--safe-left, 0px));
        padding-right: max(env(safe-area-inset-right), var(--safe-right, 0px));
      }
      canvas { display: block; touch-action: none; }
      /* iOS app: the native launch screen's dusk image stays behind a transparent WebView until
         the first canvas frame (agent N) — no solid flash in between. Web keeps the gradient. */
      html.native, html.native body { background: transparent; }

      /* ── Intro ─────────────────────────────────────────────────────────────────────────────
         Brand moment: the dusk launch image continues, a lantern wakes up, the wordmark settles in, then the
         night opens onto the board. Inline + opacity/transform only → paints with the first frame and runs on
         the compositor, so it costs the cold-start path nothing (the board is already building underneath). */
      @font-face { font-family: "Duskwick Fredoka"; font-weight: 600; font-display: block; src: url("fonts/fredoka-latin-600-normal.woff2") format("woff2"); }
      #intro {
        position: fixed; inset: 0; z-index: 20; overflow: hidden; cursor: default;
        background: #0f1124 url("launch-dusk.svg") center / 100% 100% no-repeat;
        transition: opacity .5s ease-in .0s; --k: 1; /* --k scales every delay/duration (repeat launches: .62) */
      }
      #intro.fast { --k: .62; }
      #intro.out { opacity: 0; pointer-events: none; transition-duration: calc(.5s * var(--k)); }
      #intro .stage { position: absolute; left: 0; right: 0; top: 41%; height: 0; will-change: transform; transition: transform .6s cubic-bezier(.4,0,.2,1); }
      #intro.out .stage { transform: scale(1.06); }
      #intro .glow {
        position: absolute; left: 50%; top: 0; width: 460px; height: 460px; margin: -230px 0 0 -230px; border-radius: 50%; opacity: 0; will-change: transform, opacity;
        background: radial-gradient(circle, rgba(255,200,100,.62) 0%, rgba(255,170,90,.26) 34%, rgba(255,150,90,0) 68%);
        animation: i-glow calc(1.1s * var(--k)) cubic-bezier(.2,.7,.2,1) calc(.95s * var(--k)) forwards, i-breathe 2.4s ease-in-out calc(2.1s * var(--k)) infinite alternate;
      }
      #intro .lantern { overflow: visible; position: absolute; left: 50%; top: 0; width: 150px; height: 200px; margin: -110px 0 0 -75px; will-change: transform, opacity; animation: i-rise calc(.8s * var(--k)) cubic-bezier(.2,.9,.25,1) calc(.15s * var(--k)) both; }
      #intro .lit { opacity: 0; animation: i-on calc(.5s * var(--k)) ease-out calc(1.05s * var(--k)) forwards; }
      #intro .face { opacity: 0; transform-origin: 60px 84px; animation: i-face calc(.45s * var(--k)) ease-out calc(1.3s * var(--k)) forwards, i-blink 4s ease-in calc(2.6s * var(--k)) infinite; }
      #intro .taper { transform-origin: 60px 10px; opacity: 0; animation: i-taper calc(.7s * var(--k)) cubic-bezier(.5,0,.3,1) calc(.7s * var(--k)) forwards; }
      #intro .fly { position: absolute; left: 50%; top: 0; width: 5px; height: 5px; margin: -2px; border-radius: 50%; background: #ffe2a0; box-shadow: 0 0 8px 2px rgba(255,205,120,.8); opacity: 0; will-change: transform, opacity; animation: i-fly 3.4s ease-out infinite; }
      #intro .word { position: absolute; left: 0; right: 0; top: 132px; text-align: center; white-space: nowrap; font: 600 46px/1 "Duskwick Fredoka", ui-rounded, system-ui, sans-serif; color: #fff4d6; text-shadow: 0 2px 0 rgba(120,70,60,.55), 0 0 22px rgba(255,190,100,.38); }
      #intro .word span { display: inline-block; opacity: 0; will-change: transform, opacity; animation: i-letter calc(.7s * var(--k)) cubic-bezier(.2,.9,.25,1) both; }
      #intro .rule { position: absolute; left: 50%; top: 204px; width: 120px; margin-left: -60px; height: 2px; border-radius: 1px; background: linear-gradient(90deg, rgba(244,211,138,0), rgba(244,211,138,.7), rgba(244,211,138,0)); transform: scaleX(0); will-change: transform; animation: i-rule calc(.8s * var(--k)) ease-out calc(1.75s * var(--k)) forwards; }
      @keyframes i-rise { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
      @keyframes i-taper { 0% { opacity: 0; transform: translateY(-26px) scale(.7); } 25% { opacity: 1; } 80% { opacity: 1; transform: translateY(64px) scale(1); } 100% { opacity: 0; transform: translateY(70px) scale(.3); } }
      @keyframes i-on { to { opacity: 1; } }
      @keyframes i-face { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
      @keyframes i-blink { 0%, 92%, 100% { transform: none; } 96% { transform: scaleY(.15); } }
      @keyframes i-glow { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
      @keyframes i-breathe { from { transform: scale(.94); opacity: .85; } to { transform: scale(1.06); opacity: 1; } }
      @keyframes i-letter { from { opacity: 0; transform: translateY(16px) scale(.88); } to { opacity: 1; transform: none; } }
      @keyframes i-rule { to { transform: scaleX(1); } }
      @keyframes i-fly { 0% { opacity: 0; transform: translate(0, 24px); } 15% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--dx), -150px); } }
      @media (prefers-reduced-motion: reduce) {
        #intro .glow, #intro .lantern, #intro .lit, #intro .face, #intro .word span, #intro .rule { animation: none; opacity: 1; transform: none; }
        #intro .rule { transform: scaleX(1); } #intro .taper, #intro .fly { display: none; }
        #intro .stage, #intro.out .stage { transition: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="stage">
        <div class="glow"></div>
        <i class="fly" style="margin-left:-46px;--dx:-14px;animation-delay:1.5s"></i>
        <i class="fly" style="margin-left:38px;--dx:18px;animation-delay:2.1s"></i>
        <i class="fly" style="margin-left:-12px;--dx:6px;animation-delay:2.7s"></i>
        <i class="fly" style="margin-left:60px;--dx:-8px;animation-delay:3.3s"></i>
        <svg class="lantern" viewBox="0 0 120 160">
          <path d="M44 32q16-30 32 0" fill="none" stroke="#C9966A" stroke-width="5" stroke-linecap="round"/>
          <rect x="30" y="46" width="60" height="74" rx="22" fill="#23244a" stroke="#C9966A" stroke-width="4"/>
          <g class="lit">
            <rect x="30" y="46" width="60" height="74" rx="22" fill="#FFC864" stroke="#C9966A" stroke-width="4"/>
            <rect x="37" y="53" width="46" height="60" rx="17" fill="#FFF1CC"/>
          </g>
          <path d="M33 34h54l-7 14H40z" fill="#8A5A44"/>
          <rect x="35" y="116" width="50" height="13" rx="4.5" fill="#8A5A44"/>
          <g class="face">
            <circle cx="50" cy="84" r="4.4" fill="#4a2f2a"/><circle cx="70" cy="84" r="4.4" fill="#4a2f2a"/>
            <ellipse cx="43" cy="95" rx="6.5" ry="3.8" fill="#ff8fa3" opacity=".55"/><ellipse cx="77" cy="95" rx="6.5" ry="3.8" fill="#ff8fa3" opacity=".55"/>
            <path d="M54 94q6 6.5 12 0" fill="none" stroke="#4a2f2a" stroke-width="3" stroke-linecap="round"/>
          </g>
          <path class="taper" d="M60 -2q9 9 0 18q-9-9 0-18z" fill="#FFB347"/>
        </svg>
        <div class="word"><span style="animation-delay:.95s">D</span><span style="animation-delay:1.01s">u</span><span style="animation-delay:1.07s">s</span><span style="animation-delay:1.13s">k</span><span style="animation-delay:1.19s">w</span><span style="animation-delay:1.25s">i</span><span style="animation-delay:1.31s">c</span><span style="animation-delay:1.37s">k</span></div>
        <div class="rule"></div>
      </div>
    </div>
    <script>
      // Intro driver (index.html only: runs before any module). Minimum on-screen time, then it leaves as soon as the
      // board is drawn (window.__intro.ready(), called from main.ts). Tap = skip. First launch is the full 2.6 s;
      // later launches run the .62× cut. A 7 s guard means a failed boot can never leave the overlay up.
      (function () {
        var el = document.getElementById("intro");
        if (!el) return;
        if (navigator.webdriver) { el.remove(); return; } // Playwright e2e clicks the canvas straight away
        var seen = false;
        try { seen = localStorage.getItem("introSeen") === "1"; localStorage.setItem("introSeen", "1"); } catch (e) {}
        var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (seen) el.className = "fast";
        var t0 = performance.now(), min = reduced ? 900 : seen ? 1700 : 2650, ready = false, gone = false;
        function leave() {
          if (gone) return;
          gone = true;
          el.className += " out";
          setTimeout(function () { el.remove(); }, 700);
        }
        function check() {
          if (gone) return;
          var left = min - (performance.now() - t0);
          if (ready && left <= 0) leave(); else setTimeout(check, Math.max(left, 40));
        }
        el.addEventListener("pointerdown", function () { ready = true; min = 0; leave(); });
        window.__intro = { ready: function () { ready = true; } };
        setTimeout(function () { ready = true; min = 0; check(); }, 7000);
        check();
      })();
    </script>
    <script>
      // Capacitor's iOS bridge is injected at document start
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) document.documentElement.classList.add("native");
    </script>
    <div id="safe"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
