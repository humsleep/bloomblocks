const root = document.getElementById("root");
const CREAM = "#FFF3DE", SUB = "#B9AED6", SHEET = "#2C2752", SHEET_HI = "#3A3468", INK = W2.INK;
const SHOTS = "../shots/v11/";
const FONT = 'Fredoka, "Apple SD Gothic Neo", "Hiragino Sans", sans-serif';

function mk(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.round(w * DPR); c.height = Math.round(h * DPR);
  c.style.width = w + "px"; c.style.height = h + "px";
  root.appendChild(c);
  const ctx = c.getContext("2d");
  ctx.scale(DPR, DPR);
  return ctx;
}
function T(ctx, s, x, y, size = 16, weight = 500, col = CREAM, align = "left") {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.fillText(s, x, y);
}
function rr(ctx, x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
const imgs = {};
function load(name) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => { imgs[name] = im; res(im); }; im.onerror = rej; im.src = SHOTS + name; });
}
// draw a pt-space crop of a v11 shot (shots are @2x: 393×852 pt)
function crop(ctx, name, sx, sy, sw, sh, dx, dy, scale = 1) {
  ctx.drawImage(imgs[name], sx * 2, sy * 2, sw * 2, sh * 2, dx, dy, sw * scale, sh * scale);
}
function clip(ctx, x, y, w, h, r, fn) { ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip(); fn(); ctx.restore(); }
function duskGrad(ctx, x, y, w, h) {
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#1F1C40"); g.addColorStop(0.55, "#3A2F63"); g.addColorStop(0.85, "#7A5A8E"); g.addColorStop(1, "#C98A9C");
  return g;
}
function stars(ctx, x, y, w, h, n, seed = 3) {
  let s = seed;
  const r = () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < n; i++) { ctx.globalAlpha = 0.3 + r() * 0.5; ctx.fillStyle = CREAM; ctx.beginPath(); ctx.arc(x + r() * w, y + r() * h, 0.6 + r() * 0.9, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
}
// warm the white-hot glass core so ink + blush read (proposed renderer tweak, spec §5.5)
function warmGlass(ctx, cx, cy, r) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, "rgba(255,236,196,.55)"); g.addColorStop(1, "rgba(255,236,196,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
}
// Wick placed by ground contact point (gx, gy) in pt
function wickAt(ctx, gx, gy, size, o = {}) { W2.draw(ctx, { ...o, x: gx - size / 2 + (o.dx || 0) * size / 100, y: gy - size * 0.92, size }); }
function bubble(ctx, x, y, w, h, text, tail) {
  ctx.fillStyle = "rgba(10,8,30,.3)"; ctx.beginPath(); ctx.roundRect(x + 2, y + 4, w, h, 16); ctx.fill();
  rr(ctx, x, y, w, h, 16, "#FFF6E6", "#E8D4B8", 2);
  if (tail) { ctx.fillStyle = "#FFF6E6"; ctx.beginPath(); ctx.moveTo(tail[0] - 7, y + h - 1); ctx.lineTo(tail[0], y + h + 9); ctx.lineTo(tail[0] + 7, y + h - 1); ctx.fill(); }
  const lines = text.split("\n");
  lines.forEach((l, i) => T(ctx, l, x + w / 2, y + h / 2 + 6 - (lines.length - 1) * 10 + i * 20, 16, 600, INK, "center"));
}
function simpleLantern(ctx, cx, cy, w, pal, expr) {
  // mini board-lantern (for friend cards / town): frame + tinted glass + face
  const h = w * 1.25;
  ctx.strokeStyle = "#4A3328"; ctx.lineWidth = w * 0.07; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(cx, cy - h * 0.5, w * 0.24, Math.PI, 0); ctx.stroke();
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.6);
  g.addColorStop(0, pal.core); g.addColorStop(0.6, pal.body); g.addColorStop(1, pal.rim);
  rr(ctx, cx - w * 0.42, cy - h * 0.42, w * 0.84, h * 0.84, w * 0.3, g);
  rr(ctx, cx - w * 0.5, cy - h * 0.5, w, h * 0.12, w * 0.06, "#6E4C38");
  rr(ctx, cx - w * 0.5, cy + h * 0.4, w, h * 0.12, w * 0.06, "#6E4C38");
  ctx.fillStyle = "#4A3328"; ctx.fillRect(cx - w * 0.5, cy - h * 0.42, w * 0.08, h * 0.84); ctx.fillRect(cx + w * 0.42, cy - h * 0.42, w * 0.08, h * 0.84);
  W2.lanternFace(ctx, cx, cy, w * 0.82, expr);
}

const ARCH = {
  onion: "M50 14 C52 26 56 34 68 44 C82 55 84 72 74 84 C67 91 58 93 50 93 C42 93 33 91 26 84 C16 72 18 55 32 44 C44 34 48 26 50 14 Z",
  dumpling: "M50 30 C54 30 56 33 57 36 C70 38 86 52 86 70 C86 84 72 92 50 92 C28 92 14 84 14 70 C14 52 30 38 43 36 C44 33 46 30 50 30 Z",

};
function maskOf(drawFn) {
  const S = 200, c = document.createElement("canvas"); c.width = S; c.height = S;
  const x = c.getContext("2d"); drawFn(x, S);
  const d = x.getImageData(0, 0, S, S).data;
  let x0 = S, y0 = S, x1 = 0, y1 = 0;
  for (let y = 0; y < S; y++) for (let i = 0; i < S; i++) if (d[(y * S + i) * 4 + 3] > 127) { x0 = Math.min(x0, i); x1 = Math.max(x1, i); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  // normalise: longest side → 60 cells, bottom-centre anchored in 64×64
  const N = 64, k = 60 / Math.max(x1 - x0 + 1, y1 - y0 + 1), m = new Uint8Array(N * N);
  const bw = (x1 - x0 + 1) * k, bh = (y1 - y0 + 1) * k, ox = (N - bw) / 2, oy = N - 2 - bh;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const sx = Math.floor(x0 + (i - ox) / k), sy = Math.floor(y0 + (j - oy) / k);
    if (sx >= x0 && sx <= x1 && sy >= y0 && sy <= y1 && d[(sy * S + sx) * 4 + 3] > 127) m[j * N + i] = 1;
  }
  return m;
}
function iou(a, b) { let I = 0, U = 0; for (let i = 0; i < a.length; i++) { I += a[i] & b[i]; U += a[i] | b[i]; } return I / U; }

      r[e.id] = archKeys.map((k, j) => +iou(m, am[j]).toFixed(3));
    }
    window.__results = r; return;
  }
  const archKeys = Object.keys(ARCH);
  const am = archKeys.map((k) => maskOf((x, S) => { x.scale(S / 100, S / 100); x.fill(new Path2D(ARCH[k])); }));
  const results = {};
  // header: archetype icons
  archKeys.forEach((k, j) => {
